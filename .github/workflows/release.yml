name: release

on:
  workflow_run:
    workflows: ["build"]
    branches: [main]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup Node.js to enable trusted publishing with OIDC authentication.
      # The registry-url configures npm to use GitHub Actions OIDC tokens for
      # authentication, eliminating the need for NPM_TOKEN secrets. When
      # changeset publish runs npm publish, it will automatically use OIDC
      # and generate provenance attestations.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Configure npm authentication
        run: echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm run release
          version-script: pnpm run version
          pr-title: "chore: release"
          push-with-git-cli: true

name: test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["adamantite"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Mount Btrfs scratch filesystem for reflink tests
        run: |
          if ! command -v mkfs.btrfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq btrfs-progs
          fi
          truncate -s 512M /tmp/reflink-scratch.img
          mkfs.btrfs -q /tmp/reflink-scratch.img
          sudo mkdir -p /mnt/reflink-scratch
          sudo mount -o loop /tmp/reflink-scratch.img /mnt/reflink-scratch
          sudo chown "$USER" /mnt/reflink-scratch

      - name: Run tests
        run: bun test
        env:
          PACKREF_REFLINK_TEST_DIR: /mnt/reflink-scratch
